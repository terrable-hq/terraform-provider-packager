name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit version (for example v0.3.0); otherwise increment patch
        type: string
        default: ''

permissions:
  contents: read

# Serialize allocation and publication. A newer pending main push may coalesce
# older pending pushes; its release includes all changes since the last tag.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'terrable-hq/terraform-provider-packager' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan version
        id: plan
        env:
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: python3 scripts/plan_release.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.plan.outputs.tag != ''
        with:
          go-version-file: go.mod
          cache: false
      - name: Install GoReleaser
        if: steps.plan.outputs.tag != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          install-only: true
      - name: Build and verify without signing or publishing credentials
        if: steps.plan.outputs.tag != ''
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # This tag is local only. The protected remote tag is created later.
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
          fi
          goreleaser release --clean --skip=publish,sign --config .goreleaser.yml
          PACKAGER_RELEASE_SNAPSHOT=1 go test ./tests/release -count=1 -v
          mkdir release-assets
          cp dist/*.zip dist/*_SHA256SUMS release-assets/
          cp terraform-registry-manifest.json "release-assets/terraform-provider-packager_${TAG#v}_manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        if: steps.plan.outputs.tag != ''
        with:
          name: release-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.tag != '' && github.repository == 'terrable-hq/terraform-provider-packager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    # No checkout, build tools, repository scripts, or caches in this job.
    # Its artifact is selected by immutable ID from this run's build job.
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_REPO: terrable-hq/terraform-provider-packager
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true
      - name: Validate exact asset names and checksums before accessing secrets
        shell: python
        run: |
          import hashlib, os, pathlib, re
          tag = os.environ['TAG']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag), 'Invalid version'
          root = pathlib.Path('release-assets')
          prefix = 'terraform-provider-packager_' + tag[1:]
          sums = prefix + '_SHA256SUMS'
          names = {prefix + '_' + platform + '_' + arch + '.zip'
                   for platform in ('darwin', 'linux', 'windows') for arch in ('amd64', 'arm64')}
          names.add(prefix + '_manifest.json')
          assert {p.name for p in root.iterdir()} == names | {sums}, 'Unexpected assets'
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir()), 'Non-file asset'
          remaining = set(names)
          for line in (root / sums).read_text().splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  (\S+)', line)
              assert match and match[2] in remaining, 'Invalid checksum entry'
              remaining.remove(match[2])
              assert hashlib.sha256((root / match[2]).read_bytes()).hexdigest() == match[1], 'Checksum mismatch'
          assert not remaining, 'Missing checksum entries'
      - name: Import signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Sign and verify checksums
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          sums="release-assets/terraform-provider-packager_${TAG#v}_SHA256SUMS"
          gpg --batch --local-user "$GPG_FINGERPRINT" --output "$sums.sig" --detach-sign "$sums"
          gpg --batch --verify "$sums.sig" "$sums"
      - name: Create repository-scoped release token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: terrable-hq
          repositories: terraform-provider-packager
          permission-contents: write
      - name: Reserve immutable tag and publish signed assets
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A queued/retried run must not publish an older commit after main
          # has moved on. The pending main run will include its changes.
          current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if test "$current_main" != "$GITHUB_SHA"; then
            echo 'Superseded by a newer main commit; skipping publication.'
            exit 0
          fi
          # Never replace an existing tag or release. Reruns of a successful
          # publication are no-ops; incomplete drafts need maintainer inspection.
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > ref.json 2>/dev/null; then
            test "$(jq -r '.object.type' ref.json)" = commit
            test "$(jq -r '.object.sha' ref.json)" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            if test "$(jq -r '.isDraft' release.json)" = false; then
              echo 'Release already published; leaving it unchanged.'
              exit 0
            fi
            echo 'Existing draft requires maintainer inspection; refusing to overwrite assets.' >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --notes "Preview build from main commit $GITHUB_SHA." release-assets/*
          gh release edit "$TAG" --draft=false --prerelease
